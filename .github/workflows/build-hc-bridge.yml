name: build-hc-bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone bridge source at pinned commit
        run: |
          git clone https://github.com/OhiyoX/xiaomi-health-connect-bridge.git src
          git -C src checkout 3043528a85b8e0f4cdeb738bb84b32a7a23f0243

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          cd src
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-build-1" src/app/build/outputs/apk/debug/app-debug.apk --title "hc-bridge debug APK" --notes "Debug APK built from OhiyoX/xiaomi-health-connect-bridge at pinned commit 3043528"
