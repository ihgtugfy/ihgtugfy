name: build-hc-bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone bridge source at pinned commit
        run: |
          git clone https://github.com/OhiyoX/xiaomi-health-connect-bridge.git src
          git -C src checkout 3043528a85b8e0f4cdeb738bb84b32a7a23f0243

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Build debug APK (log captured)
        run: |
          cd src
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --console=plain > ../build.log 2>&1
          echo "GRADLE_EXIT=$?" >> ../build.log
          ls -la app/build/outputs/apk/debug/ >> ../build.log 2>&1 || true

      - name: Publish release with APK and/or log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f src/app/build/outputs/apk/debug/app-debug.apk ]; then
            gh release create "apk-build-2" src/app/build/outputs/apk/debug/app-debug.apk build.log --title "hc-bridge debug APK (build 2)" --notes "APK + build log"
          else
            gh release create "apk-build-2" build.log --title "hc-bridge build 2 log (no APK)" --notes "Build failed; log attached for diagnosis"
          fi
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone bridge source at pinned commit
        run: |
          git clone https://github.com/OhiyoX/xiaomi-health-connect-bridge.git src
          git -C src checkout 3043528a85b8e0f4cdeb738bb84b32a7a23f0243

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          cd src
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-build-1" src/app/build/outputs/apk/debug/app-debug.apk --title "hc-bridge debug APK" --notes "Debug APK built from OhiyoX/xiaomi-health-connect-bridge at pinned commit 3043528"
